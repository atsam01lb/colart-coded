<form
  id="contactForm"
  class="contact-form fade-in"
  action="https://formsubmit.co/elhindysamuel@gmail.com"
  method="POST"
>

  <!-- FormSubmit Settings -->
  <input
    type="hidden"
    name="_subject"
    value="New Contact Form Submission - Colart Website"
  />

  <input
    type="hidden"
    name="_captcha"
    value="false"
  />

  <input
    type="hidden"
    name="_template"
    value="table"
  />

  <input
    type="hidden"
    name="_next"
    value="https://www.colartdigitalmarketingagency.com/contact/"
  />

  <div class="contact-form-grid">

    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        name="Full Name"
        required
        autocomplete="name"
      />
    </div>

    <div class="form-group">
      <label for="emailAddress">Email Address</label>
      <input
        type="email"
        id="emailAddress"
        name="Email Address"
        required
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label for="phoneNumber">Phone Number</label>
      <input
        type="tel"
        id="phoneNumber"
        name="Phone Number"
        required
        autocomplete="tel"
      />
    </div>

    <div class="form-group">
      <label for="serviceNeeded">Service Needed</label>

      <select
        id="serviceNeeded"
        name="Service Needed"
        required
      >
        <option value="" selected disabled>
          Select a service
        </option>

        <option value="Brand Identity">
          Brand Identity
        </option>

        <option value="Social Media Management">
          Social Media Management
        </option>

        <option value="Digital Marketing">
          Digital Marketing
        </option>

        <option value="Media Production">
          Media Production
        </option>

        <option value="Web Design / UI UX">
          Web Design / UI UX
        </option>

        <option value="Development">
          Development
        </option>

        <option value="Other">
          Other
        </option>
      </select>
    </div>

    <div class="form-group form-group-full">
      <label for="projectDetails">
        Project Details
      </label>

      <textarea
        id="projectDetails"
        name="Project Details"
        rows="6"
        placeholder="Tell us about your business, what you need, timelines, or anything helpful."
        required
      ></textarea>
    </div>

  </div>

  <div class="contact-terms-row">

    <label class="terms-check">

      <input
        type="checkbox"
        id="acceptTerms"
        name="Accepted Terms"
        value="Yes"
        required
      />

      <span class="terms-check-box">
        <i class="fa-solid fa-check"></i>
      </span>

      <span class="terms-check-text">
        I have read and accept the

        <button
          type="button"
          class="terms-link-button"
          data-terms-open
        >
          Terms of Service
        </button>.
      </span>

    </label>

  </div>

  <div class="contact-submit-row">

    <button
      type="submit"
      class="btn-pill-gradient"
    >
      <span>Send Inquiry</span>
      <i class="fa-solid fa-paper-plane"></i>
    </button>

    <p class="contact-submit-note">
      Submitting will send your inquiry by email and open WhatsApp with the same message.
    </p>

  </div>

</form>
