<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact Colart | Digital Marketing Agency in Lebanon</title>

  <link rel="stylesheet" href="/assets/css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header>
  <a href="/" class="logo">
    <img src="/assets/images/colart-logo.png" alt="Colart logo">
  </a>

  <nav>
    <a href="/">Home</a>
    <a href="/services/">Services</a>
    <a href="/our-work/">Our Work</a>
    <a href="/contact/" class="active">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section>
  <h1>Contact Colart</h1>
  <p>Let’s talk about your project</p>
</section>

<!-- FORM -->
<section>

  <form id="contactForm"
        action="https://formsubmit.co/elhindysamuel@gmail.com"
        method="POST">

    <!-- FormSubmit config -->
    <input type="hidden" name="_subject" value="New Inquiry - Colart Website">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://www.colartdigitalmarketingagency.com/contact/">

    <label>Full Name</label>
    <input type="text" id="fullName" name="Full Name" required>

    <label>Email</label>
    <input type="email" id="emailAddress" name="Email" required>

    <label>Phone</label>
    <input type="tel" id="phoneNumber" name="Phone" required>

    <label>Service</label>
    <select id="serviceNeeded" name="Service" required>
      <option disabled selected>Select service</option>
      <option>Branding</option>
      <option>Social Media</option>
      <option>Marketing</option>
      <option>Web Design</option>
      <option>Production</option>
    </select>

    <label>Message</label>
    <textarea id="projectDetails" name="Message" required></textarea>

    <label>
      <input type="checkbox" required>
      I accept Terms
    </label>

    <button type="submit">Send Inquiry</button>

  </form>

</section>

<footer>
  <p>© 2026 Colart</p>
</footer>

<script>
const form = document.getElementById("contactForm");

form.addEventListener("submit", function () {

  const name = document.getElementById("fullName").value;
  const email = document.getElementById("emailAddress").value;
  const phone = document.getElementById("phoneNumber").value;
  const service = document.getElementById("serviceNeeded").value;
  const message = document.getElementById("projectDetails").value;

  const text =
`New Inquiry from Colart Website

Name: ${name}
Email: ${email}
Phone: ${phone}
Service: ${service}

Message:
${message}`;

  const url = "https://wa.me/96170649423?text=" + encodeURIComponent(text);

  setTimeout(() => {
    window.open(url, "_blank");
  }, 800);

});
</script>

</body>
</html>
